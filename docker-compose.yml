services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://agrolink:agrolink@db:5432/agrolink
      SECRET_KEY: troque-esta-chave-antes-de-produzir
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: agrolink
      POSTGRES_USER: agrolink
      POSTGRES_PASSWORD: agrolink
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrolink -d agrolink"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
volumes:
  postgres_data:

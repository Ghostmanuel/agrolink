async function sendChat() {
  const id = $('chatOrderId').value;
  const text = $('chatText').value.trim();
  const fileInput = $('chatPhoto');
  
  if (!id || (!text && !fileInput.files.length)) return;

  try {
    let photoUrl = null;
    
    // Convert file to Base64 data URL if selected
    if (fileInput.files.length) {
      photoUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(fileInput.files[0]);
      });
    }

    await api(`/api/chat/${id}`, {
      method: 'POST',
      body: JSON.stringify({ message: text, photo: photoUrl })
    });

    $('chatText').value = '';
    fileInput.value = '';
    loadChat();
  } catch(e) {
    alert('Erro ao enviar mensagem: ' + e.message);
  }
}

async function loadProfile() {
  try {
    const user = await api('/api/auth/me');
    let html = `
      <div class="card">
        <h3>${esc(user.full_name)}</h3>
        <p class="muted"><strong>Telefone:</strong> ${esc(user.phone)}</p>
        <p class="muted"><strong>Perfil:</strong> ${esc(user.role)}</p>
        <p class="muted"><strong>Província:</strong> ${esc(user.province || 'Não informada')}</p>
        <p class="muted"><strong>Endereço:</strong> ${esc(user.address || 'Não informado')}</p>
        <button class="btn danger full" style="margin-top:12px" onclick="logout()">Sair da Conta</button>
      </div>
    `;
    
    if (S.role === 'seller') {
      html += `
        <div class="card">
          <h3>Painel do Produtor</h3>
          <button class="btn full" onclick="openNewProductModal()">+ Novo Produto</button>
        </div>
      `;
    }
    $('profileBox').innerHTML = html;
  } catch(e) {
    $('profileBox').innerHTML = '<div class="notice error">Erro ao carregar perfil: ' + esc(e.message) + '</div>';
  }
}

function openNewProductModal() {
  $('modalTitle').textContent = 'Cadastrar Novo Produto';$('modalBody').innerHTML = `
    <div class="field"><label>Nome do Produto</label><input id="pName" required></div>
    <div class="field"><label>Preço (Kz)</label><input id="pPrice" type="number" required></div>
    <div class="field"><label>Quantidade</label><input id="pQty" type="number" required></div>
    <div class="field"><label>Unidade (ex: kg, saco, caixa)</label><input id="pUnit" value="kg" required></div>
    <div class="field"><label>Localização</label><input id="pLoc" required></div>
    <div class="field"><label>Descrição</label><textarea id="pDesc"></textarea></div>
    <button class="btn full" style="margin-top:10px" onclick="saveProduct()">Publicar Produto</button>

  openModal();

async function saveProduct() {
  try {
    await api('/api/products', {
      method: 'POST',
      body: JSON.stringify({
        name: $('pName').value,
        price_kz: Number($('pPrice').value),
        quantity: Number($('pQty').value),
        unit: $('pUnit').value,
        location: $('pLoc').value,
        description: $('pDesc').value
      })
    });
    closeModal();
    alert('Produto cadastrado com sucesso!');
    loadProducts();
  } catch(e) {
    alert(e.message);
  }
}

async function aiInsights() {
  $('modalTitle').textContent = 'Insights Agrícolas - IA';
  $('modalBody').innerHTML = '<div class="notice">Carregando análises de mercado...</div>';
  openModal();
  try {
    const res = await api('/api/ai/market-insights');
    $('modalBody').innerHTML = `<p>${esc(res.insights || 'Não há recomendações no momento.')}</p>`;
  } catch(e) {
    $('modalBody').innerHTML = `<div class="notice error">Erro ao carregar IA: ${esc(e.message)}</div>`;
  }
}

function openModal() { $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); }

<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AgroLink Angola</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#2F6B3A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--g:#2f6b3a;--gd:#1e4a28;--o:#c9752f;--bg:#f7f8f3;--card:#fff;--txt:#16231a;--muted:#667267;--line:#dde4d8;--danger:#b4432e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg)}header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:48px;height:48px;object-fit:contain;border-radius:12px}.brand b{font-size:18px}.brand small{display:block;color:var(--g)}main{padding:14px 14px 100px}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #1930180d}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:9px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}.field textarea{min-height:80px}.btn{border:0;border-radius:11px;padding:11px 13px;background:var(--g);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:white;color:var(--g);border:1px solid var(--g)}.btn.orange{background:var(--o)}.btn.danger{background:var(--danger)}.btn.full{width:100%}.muted{color:var(--muted);font-size:13px}.price{font-weight:800;color:var(--gd);font-size:18px}.tag{display:inline-block;background:#edf4e9;color:var(--gd);border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}.search{display:flex;gap:8px}.search input{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:8px 11px}.tabs button.active{background:var(--g);color:white}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:white;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:20}.bottom button{flex:1;border:0;background:none;color:var(--muted);font-size:11px}.bottom button b{display:block;font-size:19px}.bottom button.active{color:var(--g)}.hidden{display:none!important}.notice{padding:10px;border-radius:10px;background:#fff4dc;margin:10px 0;font-size:13px}.ok{background:#eaf6ea}.error{background:#fdecea;color:#8b2415}.product img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#eef2ea}.auth{padding:22px 16px}.auth .logo{width:150px;height:150px;object-fit:contain;display:block;margin:10px auto}.small{font-size:11px}.stat{font-size:24px;font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:none;z-index:50;align-items:flex-end}.modal.open{display:flex}.sheet{background:white;width:min(520px,100%);border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}.chat{max-height:50vh;overflow:auto}.msg{padding:8px 10px;border-radius:12px;background:#edf2ea;margin:6px 0}.mine{background:#dcefdc;margin-left:28px}.right{margin-left:auto}
</style></head>
<body><div id="app">
<section id="auth" class="screen active auth"><img class="logo" src="/LogoAgrolink.jpeg"><h2>AgroLink Angola</h2><p class="muted">Conectamos produtores e consumidores.</p><div class="tabs"><button id="loginTab" class="active" onclick="authMode('login')">Entrar</button><button id="registerTab" onclick="authMode('register')">Criar conta</button></div>
<form id="loginForm"><div class="field"><label>Telefone</label><input id="loginPhone" placeholder="900 000 001" required></div><div class="field"><label>Palavra-passe</label><input id="loginPassword" type="password" required></div><button class="btn full">Entrar</button></form>
<form id="registerForm" class="hidden"><div class="field"><label>Nome completo</label><input id="rName" required minlength="3"></div><div class="field"><label>Telefone</label><input id="rPhone" required placeholder="900000001"></div><div class="field"><label>Palavra-passe (mín. 8)</label><input id="rPass" type="password" minlength="8" required></div><div class="field"><label>Perfil</label><select id="rRole" onchange="roleFields()"><option value="buyer">Comprador</option><option value="seller">Produtor / Vendedor</option><option value="transporter">Transportador</option></select></div><div class="field"><label>Província</label><input id="rProvince" required></div><div class="field"><label>Endereço</label><input id="rAddress" required></div><div id="sellerFields" class="hidden"><div class="field"><label>Empresa</label><input id="rCompany"></div><div class="field"><label>Fazenda</label><input id="rFarm"></div></div><div id="transFields" class="hidden"><div class="field"><label>BI</label><input id="rBI"></div></div><button class="btn full">Criar conta</button></form><div id="authMsg"></div></section>
<header id="top" class="hidden"><div class="brand"><img src="/LogoAgrolink.jpeg"><div><b>AgroLink Angola</b><small>Mercado agrícola</small></div><button class="btn secondary right" onclick="logout()">Sair</button></div></header>
<main id="main" class="hidden">
<section id="market" class="screen active"><div class="row between"><div><h2>Mercado</h2><div class="muted">Encontre produtos de produtores em Angola.</div></div><button class="btn orange" onclick="aiInsights()">IA</button></div><div class="search"><input id="search" placeholder="Pesquisar produto, produtor ou local"><button class="btn" onclick="loadProducts()">Pesquisar</button></div><div id="cats" class="tabs"></div><div id="products"></div></section>
<section id="orders" class="screen"><h2>Pedidos</h2><div id="ordersList"></div></section>
<section id="transport" class="screen"><div class="row between"><div><h2>Transporte</h2><div class="muted">Veículos disponíveis e entregas.</div></div><button class="btn secondary" onclick="loadTransporters()">Atualizar</button></div><div id="transportContent"></div></section>
<section id="chatScreen" class="screen"><h2>Chat</h2><div class="field"><label>ID do pedido</label><input id="chatOrderId" type="number"></div><button class="btn" onclick="loadChat()">Abrir conversa</button><div id="chatBox" class="chat"></div><div id="chatSend" class="hidden"><div class="row"><input id="chatText" style="flex:1;padding:11px;border:1px solid var(--line);border-radius:10px"><button class="btn" onclick="sendChat()">Enviar</button></div></div></section>
<section id="profile" class="screen"><h2>Perfil</h2><div id="profileBox"></div><div id="sellerPanel" class="hidden"></div><div id="vehiclePanel" class="hidden"></div><div id="adminPanel" class="hidden"></div></section>
</main><nav id="nav" class="bottom hidden"><button onclick="show('market')"><b>⌂</b>Mercado</button><button onclick="show('orders')"><b>▣</b>Pedidos</button><button onclick="show('transport')"><b>🚚</b>Transporte</button><button onclick="show('chatScreen')"><b>💬</b>Chat</button><button onclick="show('profile')"><b>◉</b>Perfil</button></nav>
<div id="modal" class="modal"><div class="sheet"><div class="row between"><h3 id="modalTitle">AgroLink</h3><button class="btn secondary" onclick="closeModal()">Fechar</button></div><div id="modalBody"></div></div></div>
</div>
<script>
const S={token:localStorage.getItem('agrolink_token')||'',role:localStorage.getItem('agrolink_role')||'',name:localStorage.getItem('agrolink_name')||'',cat:null};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opts={}){opts.headers={...(opts.headers||{}), 'Content-Type':'application/json'};if(S.token)opts.headers.Authorization='Bearer '+S.token;const r=await fetch(path,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.detail||d.message||`Erro ${r.status}`);return d}
function authMode(m){$('loginForm').classList.toggle('hidden',m!=='login');$('registerForm').classList.toggle('hidden',m!=='register');$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register')}
function roleFields(){const r=$('rRole').value;$('sellerFields').classList.toggle('hidden',r!=='seller');$('transFields').classList.toggle('hidden',r!=='transporter')}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone:$('loginPhone').value,password:$('loginPassword').value})});S.token=d.access_token;S.role=d.role;S.name=d.full_name;localStorage.setItem('agrolink_token',S.token);localStorage.setItem('agrolink_role',S.role);localStorage.setItem('agrolink_name',S.name);start()}catch(err){$('authMsg').innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}}
$('registerForm').onsubmit=async e=>{e.preventDefault();const role=$('rRole').value;const body={full_name:$('rName').value,phone:$('rPhone').value,password:$('rPass').value,role,province:$('rProvince').value,address:$('rAddress').value,company_name:$('rCompany').value||null,farm_name:$('rFarm').value||null,bi_number:$('rBI').value||null};try{await api('/api/auth/register',{method:'POST',body:JSON.stringify(body)});const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({phone:body.phone,password:body.password})});S.token=d.access_token;S.role=d.role;S.name=d.full_name;localStorage.setItem('agrolink_token',S.token);localStorage.setItem('agrolink_role',S.role);localStorage.setItem('agrolink_name',S.name);start()}catch(err){$('authMsg').innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}}
function start(){$('auth').classList.add('hidden');$('top').classList.remove('hidden');$('main').classList.remove('hidden');$('nav').classList.remove('hidden');loadCategories();loadProducts();loadOrders();loadProfile();if(S.role==='transporter')loadTransporters()}
function logout(){localStorage.clear();location.reload()}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));if(id==='market')loadProducts();if(id==='orders')loadOrders();if(id==='transport')loadTransporters();if(id==='profile')loadProfile()}
async function loadCategories(){try{const rows=await api('/api/categories');$('cats').innerHTML='<button class="active" onclick="S.cat=null;loadProducts()">Todos</button>'+rows.map(c=>`<button onclick="S.cat=${c.id};loadProducts()">${esc(c.name)}</button>`).join('')}catch{}}
async function loadProducts(){try{let q=$('search').value||'';let url='/api/products?q='+encodeURIComponent(q);if(S.cat)url+='&category_id='+S.cat;const rows=await api(url);$('products').innerHTML=rows.length?rows.map(p=>`<article class="card product"><img src="${esc(p.photo||'/LogoAgrolink.jpeg')}" onerror="this.src='/LogoAgrolink.jpeg'"><div class="row between"><div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.category_name||'Sem categoria')} · ${esc(p.location||'')}</div></div><span class="price">${Number(p.price_kz).toLocaleString('pt-AO')} Kz</span></div><p class="muted">${esc(p.description||'')}</p><span class="tag">${esc(p.quantity)} ${esc(p.unit)}</span><span class="tag">${esc(p.company_name||p.farm_name||p.seller_name)}</span><button class="btn full" style="margin-top:10px" onclick="buy(${p.id})">Comprar</button></article>`).join(''):'<div class="notice">Nenhum produto encontrado.</div>'}catch(err){$('products').innerHTML='<div class="notice error">'+esc(err.message)+'</div>'}}
async function buy(id){const q=prompt('Quantidade desejada:');if(!q||Number(q)<=0)return;const address=prompt('Endereço de entrega:');if(!address)return;try{const d=await api('/api/orders',{method:'POST',body:JSON.stringify({product_id:id,quantity:Number(q),delivery_address:address})});alert('Pedido #'+d.order_id+' criado. Aguarde a análise do vendedor.');loadOrders();show('orders')}catch(e){alert(e.message)}}
async function loadOrders(){try{const rows=await api('/api/orders');$('ordersList').innerHTML=rows.length?rows.map(o=>`<article class="card"><div class="row between"><h3>#${o.id} · ${esc(o.product_name)}</h3><span class="tag">${esc(o.status)}</span></div><div class="muted">${esc(o.quantity)} · ${Number(o.total_kz).toLocaleString('pt-AO')} Kz · entrega: ${esc(o.delivery_address)}</div><div class="muted">Transporte: ${esc(o.transport_mode)} · pagamento: ${esc(o.payment_status)}</div><div class="row" style="margin-top:10px">${S.role==='seller'&&o.status==='PENDING_SELLER'?`<button class="btn" onclick="review(${o.id},true)">Aceitar</button><button class="btn danger" onclick="review(${o.id},false)">Rejeitar</button>`:''}${S.role==='transporter'&&o.delivery_current_status==='REQUESTED'?`<button class="btn" onclick="deliveryDecision(${o.delivery_id},true)">Aceitar transporte</button><button class="btn danger" onclick="deliveryDecision(${o.delivery_id},false)">Rejeitar</button>`:''}${(o.status==='SELLER_ACCEPTED'&&(S.role==='buyer'||S.role==='seller'))?`<button class="btn secondary" onclick="chooseTransport(${o.id})">Entrega</button>`:''}<button class="btn secondary" onclick="orderDetail(${o.id})">Detalhes</button></div></article>`).join(''):'<div class="notice">Ainda não há pedidos.</div>'}catch(e){$('ordersList').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function review(id,accepted){try{await api(`/api/orders/${id}/seller-review`,{method:'POST',body:JSON.stringify({accepted,note:''})});loadOrders()}catch(e){alert(e.message)}}
async function orderDetail(id){try{const d=await api('/api/orders/'+id);$('modalTitle').textContent='Pedido #'+id;let h=`<p><b>${esc(d.product.name)}</b></p><p class="muted">Produtor: ${esc(d.product.company_name||d.product.farm_name||d.product.seller_name)}</p><p>Quantidade: ${d.order.quantity}</p><p>Produto: ${Number(d.order.product_total_kz).toLocaleString('pt-AO')} Kz</p><p>Transporte: ${esc(d.order.transport_mode)} · ${Number(d.order.delivery_fee_kz).toLocaleString('pt-AO')} Kz</p><p><b>Total: ${Number(d.order.total_kz).toLocaleString('pt-AO')} Kz</b></p>`;if((d.order.transport_mode==='seller'||d.order.transport_mode==='agrolink')&&(S.role==='buyer'||S.role==='seller'))h+=`<button class="btn secondary full" onclick="quoteDistance(${id})">Calcular custo por distância</button>`;if(d.delivery)h+=`<p>Transportador: ${esc(d.delivery.transporter_name||'')}</p><p>Veículo: ${esc(d.delivery.plate||'')} ${esc(d.delivery.model||'')}</p><p>Estado: ${esc(d.delivery.status)}</p>`;if(S.role==='buyer'&&d.order.status==='SELLER_ACCEPTED'&&d.order.transport_mode!=='pending'&&d.order.payment_status==='NOT_STARTED')h+=`<button class="btn full" onclick="pay(${id},${d.order.total_kz})">Pagar</button>`;if(S.role==='buyer'&&d.delivery&&d.delivery.status!=='DELIVERED')h+=`<div class="field"><label>Código de entrega de 6 dígitos</label><input id="code${id}" inputmode="numeric"></div><button class="btn full" onclick="confirmDelivery(${d.delivery.id},${id})">Confirmar entrega</button>`;h+=`<button class="btn secondary full" style="margin-top:8px" onclick="openChat(${id})">Abrir chat</button>`;$('modalBody').innerHTML=h;openModal()}catch(e){alert(e.message)}}
async function chooseTransport(id){$('modalTitle').textContent='Definir entrega do pedido #'+id;$('modalBody').innerHTML=`<div class="notice">A escolha acontece depois da aceitação do vendedor.</div><button class="btn full" onclick="setTransport(${id},'buyer')">Retirada pelo comprador</button><button class="btn secondary full" style="margin-top:8px" onclick="setTransport(${id},'seller')">Entrega pelo vendedor</button><button class="btn orange full" style="margin-top:8px" onclick="setTransport(${id},'agrolink')">Transportador AgroLink</button>`;openModal()}
async function setTransport(id,mode){try{await api(`/api/orders/${id}/transport-choice`,{method:'POST',body:JSON.stringify({mode})});closeModal();if(mode==='agrolink')assignTransport(id);else{alert('Modalidade definida. Para entrega paga, confirme a distância/custo antes do pagamento.');loadOrders()}}catch(e){alert(e.message)}}
async function assignTransport(id){const rows=await api('/api/transporters/available');if(!rows.length){alert('Não há veículos livres neste momento.');return}$('modalTitle').textContent='Escolher transportador';$('modalBody').innerHTML=rows.map(v=>`<div class="card"><b>${esc(v.full_name)}</b><div class="muted">${esc(v.plate)} · ${esc(v.model)} · ${esc(v.vehicle_type)} · ${esc(v.capacity_kg)} kg</div><button class="btn full" onclick="requestTransport(${id},${v.transporter_id},${v.vehicle_id})">Solicitar</button></div>`).join('');openModal()}
async function requestTransport(oid,tid,vid){const origin=prompt('Origem/recolha (opcional):')||'';try{const d=await api(`/api/orders/${oid}/assign-transporter`,{method:'POST',body:JSON.stringify({transporter_id:tid,vehicle_id:vid,origin})});closeModal();alert('Solicitação enviada. Código de entrega guardado para o comprador: '+d.delivery_code_for_buyer);loadOrders()}catch(e){alert(e.message)}}
async function deliveryDecision(did,accept){try{await api(`/api/deliveries/${did}/${accept?'accept':'reject'}`,{method:'POST'});alert(accept?'Transporte aceite.':'Transporte rejeitado.');loadOrders();loadTransporters()}catch(e){alert(e.message)}}
async function quoteDistance(id){const km=prompt('Distância rodoviária em km (use a distância do serviço de rotas que será integrado em produção):');if(km===null||Number(km)<0)return;try{const d=await api(`/api/orders/${id}/delivery-quote`,{method:'POST',body:JSON.stringify({distance_km:Number(km),destination:''})});alert(`Transporte: ${Number(d.delivery_fee_kz).toLocaleString('pt-AO')} Kz\nTotal: ${Number(d.total_kz).toLocaleString('pt-AO')} Kz`);orderDetail(id)}catch(e){alert(e.message)}}
async function loadTransporters(){try{if(S.role==='transporter'){const vs=await api('/api/vehicles/mine');$('transportContent').innerHTML=`<div class="card"><h3>Meus veículos</h3>${vs.map(v=>`<div class="row between"><span>${esc(v.plate)} · ${esc(v.model)}</span><span class="tag">${esc(v.status)}</span></div>`).join('')||'<div class="muted">Nenhum veículo.</div>'}<hr><h3>Adicionar veículo</h3><div class="grid"><div class="field"><label>Matrícula</label><input id="vPlate"></div><div class="field"><label>Modelo</label><input id="vModel"></div></div><div class="grid"><div class="field"><label>Tipo</label><input id="vType" value="camião"></div><div class="field"><label>Capacidade kg</label><input id="vCap" type="number"></div></div><button class="btn full" onclick="saveVehicle()">Registar veículo</button></div>`}else{const rows=await api('/api/transporters/available');$('transportContent').innerHTML=`<div class="card"><b>${rows.length}</b> veículos livres encontrados.</div>`+rows.map(v=>`<div class="card"><b>${esc(v.full_name)}</b><div class="muted">${esc(v.plate)} · ${esc(v.model)} · ${esc(v.capacity_kg)} kg</div><span class="tag">${esc(v.status)}</span></div>`).join('')}}catch(e){$('transportContent').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function saveVehicle(){try{await api('/api/vehicles',{method:'POST',body:JSON.stringify({plate:$('vPlate').value,model:$('vModel').value,vehicle_type:$('vType').value,capacity_kg:Number($('vCap').value)})});loadTransporters()}catch(e){alert(e.message)}}
async function pay(id,total){const method=prompt('Método: MULTICAIXA_REFERENCE, MULTICAIXA_EXPRESS, IBAN ou KWIK','MULTICAIXA_REFERENCE');if(!method)return;try{await api(`/api/orders/${id}/payment`,{method:'POST',body:JSON.stringify({method,amount_kz:Number(total),reference:'',transaction_id:'',idempotency_key:crypto.randomUUID()})});alert('Pagamento registado como PENDING. A confirmação financeira deve vir do PSP.');loadOrders();closeModal()}catch(e){alert(e.message)}}
async function confirmDelivery(did,oid){const code=$('code'+oid).value;if(!/^\d{6}$/.test(code))return alert('Informe os 6 dígitos.');try{await api(`/api/deliveries/${did}/confirm`,{method:'POST',body:JSON.stringify({code})});alert('Entrega confirmada.');closeModal();loadOrders()}catch(e){alert(e.message)}}
async function openChat(id){closeModal();$('chatOrderId').value=id;show('chatScreen');loadChat()}
async function loadChat(){const id=$('chatOrderId').value;if(!id)return;try{const rows=await api(`/api/orders/${id}/chat`);$('chatBox').innerHTML=rows.map(m=>`<div class="msg ${m.sender_id?'':''}"><b>${esc(m.sender_name)}</b><br>${esc(m.body)}</div>`).join('')||'<div class="muted">Sem mensagens.</div>';$('chatSend').classList.remove('hidden')}catch(e){alert(e.message)}}
async function sendChat(){const id=$('chatOrderId').value,body=$('chatText').value;if(!body)return;try{await api(`/api/orders/${id}/chat`,{method:'POST',body:JSON.stringify({body})});$('chatText').value='';loadChat()}catch(e){alert(e.message)}}
async function loadProfile(){try{const u=await api('/api/me');$('profileBox').innerHTML=`<div class="card"><h3>${esc(u.full_name)}</h3><p class="muted">${esc(u.phone)} · ${esc(u.role)}</p><p>${esc(u.province)} · ${esc(u.address)}</p>${u.producer?`<span class="tag">${esc(u.producer.company_name||u.producer.farm_name||'Produtor')}</span>`:''}</div>`;if(S.role==='seller')sellerPanel();if(S.role==='transporter')loadTransporters();if(S.role==='admin')adminPanel()}catch(e){$('profileBox').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function sellerPanel(){$('sellerPanel').classList.remove('hidden');$('sellerPanel').innerHTML=`<div class="card"><h3>Publicar produto</h3><div class="field"><label>Nome</label><input id="pName"></div><div class="field"><label>Categoria</label><select id="pCat"></select></div><div class="grid"><div class="field"><label>Preço Kz</label><input id="pPrice" type="number"></div><div class="field"><label>Quantidade</label><input id="pQty" type="number"></div></div><div class="field"><label>Unidade</label><input id="pUnit" value="kg"></div><div class="field"><label>Localização</label><input id="pLoc"></div><div class="field"><label>Foto (URL opcional)</label><input id="pPhoto"></div><div class="field"><label>Descrição</label><textarea id="pDesc"></textarea></div><button class="btn full" onclick="publish()">Publicar</button></div>`;const cs=await api('/api/categories');$('pCat').innerHTML='<option value="">Sem categoria</option>'+cs.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
async function publish(){try{await api('/api/products',{method:'POST',body:JSON.stringify({name:$('pName').value,category_id:$('pCat').value?Number($('pCat').value):null,price_kz:Number($('pPrice').value),quantity:Number($('pQty').value),unit:$('pUnit').value,location:$('pLoc').value,photo:$('pPhoto').value||null,description:$('pDesc').value})});alert('Produto publicado.');loadProducts()}catch(e){alert(e.message)}}
async function adminPanel(){$('adminPanel').classList.remove('hidden');try{const d=await api('/api/admin/dashboard');$('adminPanel').innerHTML=`<div class="card"><h3>Administração</h3><div class="grid">${Object.entries(d).map(([k,v])=>`<div><span class="muted">${esc(k)}</span><div class="stat">${Number(v).toLocaleString('pt-AO')}</div></div>`).join('')}</div></div><div class="tabs"><button onclick="adminList('users')">Utilizadores</button><button onclick="adminList('producers')">Produtores</button><button onclick="adminList('transporters')">Transportadores</button><button onclick="adminList('vehicles')">Veículos</button><button onclick="adminList('products')">Produtos</button><button onclick="adminList('orders')">Pedidos</button><button onclick="adminList('payments')">Pagamentos</button><button onclick="adminList('commissions')">Comissões</button></div><div id="adminListBox"></div><div class="card"><h3>Liquidação</h3><div class="field"><label>ID do pedido</label><input id="releaseId" type="number"></div><button class="btn full" onclick="releaseOrder()">Liberar liquidação</button></div>`}catch(e){$('adminPanel').innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function adminList(kind){try{const rows=await api('/api/admin/'+kind);$('adminListBox').innerHTML='<div class="card"><h3>'+esc(kind)+'</h3>'+rows.slice(0,50).map(r=>`<pre style="white-space:pre-wrap;font-size:11px;border-top:1px solid var(--line);padding:8px 0">${esc(JSON.stringify(r,null,2))}</pre>`).join('')+'</div>'}catch(e){alert(e.message)}}
async function releaseOrder(){try{const id=$('releaseId').value;const d=await api(`/api/admin/orders/${id}/release`,{method:'POST'});alert('Liquidação registada: '+JSON.stringify(d));adminPanel()}catch(e){alert(e.message)}}
async function aiInsights(){try{const o=await api('/api/orders');const p=await api('/api/products');openModal();$('modalTitle').textContent='AgroLink Insights';$('modalBody').innerHTML=`<div class="card"><b>Produtos no mercado:</b> ${p.length}</div><div class="card"><b>Pedidos visíveis:</b> ${o.length}</div><p class="muted">Insights nesta versão são regras internas do AgroLink. Uma futura integração LLM pode ampliar recomendações e análise comercial.</p>`}catch(e){alert(e.message)}}
function openModal(){$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(S.token)start();
</script></body></html>
